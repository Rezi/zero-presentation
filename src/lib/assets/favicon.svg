<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<title>Zero — sync engine</title>
	<defs>
		<linearGradient id="z" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffe9a8" />
			<stop offset="1" stop-color="#fac61f" />
		</linearGradient>
	</defs>

	<!-- Applifting navy tile -->
	<rect width="64" height="64" rx="14" fill="#14141f" />

	<!-- the zero glyph, drawn as an orbit -->
	<ellipse cx="32" cy="32" rx="13" ry="19" fill="none" stroke="url(#z)" stroke-width="9" />

	<!-- satellite crossing the orbit: gap punched in the ring, then the dot -->
	<circle cx="41.2" cy="18.6" r="6.6" fill="#14141f" />
	<circle cx="41.2" cy="18.6" r="4.4" fill="#5ecae7" />
</svg>
